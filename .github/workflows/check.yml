name: check

# Verifies this family on every push: parsing tests on saved pages (pytest), then scrape-check, which runs setup_family.py and the
# crawl task against a local stand-in for scrape-hub, the same way the pool runner does (and a rerun for stable record ids).
# Nothing reaches the real hub and nothing is kept: the data the pool collects is set by family.py, not here.
# Each adapter runs on a CI-only project with a few real items that cover its paths (lists, details, document downloads):
# the projects in family.py would run their own first items, NHAI tender pages that take ~10 minutes each.
# Run it by hand too: Actions -> check -> Run workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt pytest "scrape-hub-client @ git+https://github.com/s1d-labs/runner@main#subdirectory=sdk"
          python3 -c "import json; [print(c) for c in json.load(open('scrape.json')).get('setup', [])]" | grep -v "requirements.txt" | while IFS= read -r cmd; do bash -c "$cmd"; done
      - name: Parsing tests
        run: python -m pytest tests -q
      # A FAIL with http_error / timeouts below means the runner cannot reach that site.
      - name: scrape-check nhai (tender list + details, ratings page with its PDFs)
        run: >
          scrape-check --project contractor-registration-ci-nhai --task crawl --env ADAPTER=nhai --timeout 900
          --item '{"key": "tenders-p0", "payload": {"kind": "tenders", "endpoint": "tenderlist", "page": 0, "detail": true, "files": false}}'
          --item '{"key": "page-ratings", "payload": {"kind": "page", "nid": "publication-rating-dpr-consultants", "files": true}}'
      - name: scrape-check morth (two document pages with their files)
        if: ${{ always() }}
        run: >
          scrape-check --project contractor-registration-ci-morth --task crawl --env ADAPTER=morth --timeout 900
          --item '{"key": "policies-and-regulations", "payload": {"slug": "policies-and-regulations", "part": 0, "parts": 1, "files_re": "."}}'
          --item '{"key": "acts-and-rules-part0", "payload": {"slug": "acts-and-rules", "part": 0, "parts": 2, "files_re": "."}}'
      # mes.gov.in does not answer GitHub runners; in the pool its project borrows an Indian proxy (proxy="IN"), CI has none
      - name: scrape-check mes (reachability, does not fail the check)
        if: ${{ always() }}
        continue-on-error: true
        run: >
          scrape-check --project contractor-registration-ci-mes --task crawl --env ADAPTER=mes --timeout 900
          --item '{"key": "works-consultancy-miscellaneous-p0", "payload": {"path": "works/consultancy-miscellaneous", "page": 0, "files": true}}'
          --item '{"key": "works-product-approval-p1", "payload": {"path": "works/product-approval", "page": 1, "files": true}}'
      - name: scrape-check pmgsy (reachability, does not fail the check; the pool reaches it through Indian proxies)
        if: ${{ always() }}
        continue-on-error: true
        run: >
          scrape-check --project contractor-registration-ci-pmgsy --task crawl --env ADAPTER=pmgsy --timeout 600
          --item '{"key": "30-B", "payload": {"state": 30, "state_name": "Sikkim", "status": "B"}}'
      - name: scrape-check cpwd (reachability, does not fail the check; the pool reaches it through Indian proxies)
        if: ${{ always() }}
        continue-on-error: true
        run: >
          scrape-check --project contractor-registration-ci-cpwd --task crawl --env ADAPTER=cpwd --timeout 600
          --item '{"key": "suspended", "payload": {"list": "suspended", "cur": 1, "delta": 200}}'
      - name: scrape-check pmgsy agreements (reachability, does not fail the check)
        if: ${{ always() }}
        continue-on-error: true
        run: >
          scrape-check --project contractor-registration-ci-pmgsy-agreements --task crawl --env ADAPTER=pmgsy --timeout 600
          --item '{"key": "agreements-30", "payload": {"report": "agreements", "state": 30, "state_name": "Sikkim"}}'
      - name: scrape-check pmgsy road register (core network, completed roads, maintenance; reachability, does not fail the check)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          scrape-check --project contractor-registration-ci-pmgsy-corenetwork --task crawl --env ADAPTER=pmgsy --timeout 600 \
            --item '{"key": "cn-30-403", "payload": {"report": "corenetwork", "state": 30, "state_name": "Sikkim", "district": 403, "district_name": "North"}}'
          scrape-check --project contractor-registration-ci-pmgsy-maintenance --task crawl --env ADAPTER=pmgsy --timeout 600 \
            --item '{"key": "upkeep-30-2025", "payload": {"report": "maintenance", "state": 30, "state_name": "Sikkim", "year": 2025}}'
      - name: scrape-check emarg (reachability, does not fail the check)
        if: ${{ always() }}
        continue-on-error: true
        run: >
          scrape-check --project contractor-registration-ci-emarg --task crawl --env ADAPTER=emarg --timeout 600
          --item '{"key": "roads-30", "payload": {"state": 30, "state_name": "Sikkim"}}'
      - name: scrape-check statepwd (reachability, does not fail the check)
        if: ${{ always() }}
        continue-on-error: true
        run: >
          scrape-check --project contractor-registration-ci-statepwd --task crawl --env ADAPTER=statepwd --timeout 600
          --item '{"key": "gujarat-rnb-electrical", "payload": {"list": "gujarat-rnb-electrical"}}'
      - name: scrape-check rdso (reachability, does not fail the check)
        if: ${{ always() }}
        continue-on-error: true
        run: >
          scrape-check --project contractor-registration-ci-rdso --task crawl --env ADAPTER=rdso --timeout 600
          --item '{"key": "few-sources", "payload": {"section": "0,5,6634"}}'
      - name: scrape-check ocr (one scanned MoRTH debarment order, read with tesseract)
        if: ${{ always() }}
        run: >
          scrape-check --project contractor-registration-ci-ocr --task crawl --env ADAPTER=ocr --timeout 900
          --item '{"key": "morth-debarment-scan", "payload": {"source": "contractor-registration-ci-ocr", "files": [{"path": "ocr-needed/ci/Debarment-NHAI-ROM-132.pdf", "pages": 1, "url": "https://morth.gov.in/backend/documents/uploaded/1755605683_Debarment-NHAI-ROM-132.pdf"}]}}'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: scrape-check
          path: .scrape-check/
          if-no-files-found: ignore
