name: check

# Verifies this family on every push: parsing tests on saved pages (pytest), then scrape-check, which runs setup_family.py and the
# crawl task against a local stand-in for scrape-hub, the same way the pool runner does, on 2 real queue items (and a rerun).
# Nothing reaches the real hub. Run it by hand too: Actions -> check -> Run workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt pytest "scrape-hub-client @ git+https://github.com/s1d-labs/runner@main#subdirectory=sdk"
          python3 -c "import json; [print(c) for c in json.load(open('scrape.json')).get('setup', [])]" | grep -v "requirements.txt" | while IFS= read -r cmd; do bash -c "$cmd"; done
      - name: Parsing tests
        run: python -m pytest tests -q
      # One light real item per adapter, in a CI-only project (named projects would run their own heavy queue items). A FAIL here with http_error / timeouts
      # means the runner cannot reach the site: these sites answer Indian addresses only.
      - name: scrape-check nhai (local stand-in hub)
        run: >
          scrape-check --project contractor-registration-ci-nhai --task crawl --env ADAPTER=nhai --timeout 900
          --item '{"key": "tenders-p0", "payload": {"kind": "tenders", "endpoint": "tenderlist", "page": 0, "detail": false}}'
          --item '{"key": "page-ratings", "payload": {"kind": "page", "nid": "publication-rating-dpr-consultants", "files": false}}'
      - name: scrape-check morth (local stand-in hub)
        if: ${{ always() }}
        run: >
          scrape-check --project contractor-registration-ci-morth --task crawl --env ADAPTER=morth --timeout 900
          --item '{"key": "policies-and-regulations", "payload": {"slug": "policies-and-regulations", "files_re": "."}}'
          --item '{"key": "acts-and-rules", "payload": {"slug": "acts-and-rules"}}'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: scrape-check
          path: .scrape-check/
          if-no-files-found: ignore
